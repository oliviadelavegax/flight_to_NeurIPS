
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight to NeurIPS</title>
<meta name="description" content="MicroAGI boarding pass. San Francisco to Sydney, 4 December 2026. Slide the aircraft to board the flight to NeurIPS.">
<meta property="og:title" content="Flight to NeurIPS">
<meta property="og:description" content="Board the flight to NeurIPS. SFO to SYD, 4 December 2026.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%22-70%20-70%20640%20627%22%3E%3Crect%20x%3D%22-70%22%20y%3D%22-70%22%20width%3D%22640%22%20height%3D%22627%22%20fill%3D%22%23000%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%22239.011%22%20width%3D%2254.945%22%20height%3D%22247.252%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%22112.638%22%20y%3D%2249.45%22%20width%3D%2254.945%22%20height%3D%22299.45%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%22225.275%22%20y%3D%220%22%20width%3D%2254.945%22%20height%3D%22299.45%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%22335.165%22%20y%3D%2249.45%22%20width%3D%2254.945%22%20height%3D%22299.45%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%22445.055%22%20y%3D%22186.813%22%20width%3D%2254.945%22%20height%3D%22299.451%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Newsreader:ital,opsz,wght@1,6..72,300&display=swap">
<style>
  /* MicroAGI Brand Design Kit v001
     Palette  black #000000 dominant, white #FFFFFF for contrast,
              dark grey #323232 and glass light grey #E3E3E3 for structure,
              signal green #00FF51 reserved for technical signals.
     Type     Neue Haas Grotesk Display 65 Medium (headlines, -3% tracking)
              Rhymes Display Light Italic (highlights only)
              EK Modena Mono (technical copy)
     Licensed brand faces are used when installed on the viewer's machine;
     the fallbacks below are the closest webfont equivalents. */
  :root{
    --black:#000000;
    --white:#FFFFFF;
    --grey:#323232;
    --glass:#E3E3E3;
    --signal:#00FF51;

    --sans:'Neue Haas Grotesk Display Pro','NeueHaasGroteskDisplay','Neue Haas Grotesk Display','Helveticas-serif;
    --display:'Rhymes Display','RhymesDisplay-Light','Newsreader',Georgia,'Times New Roman',serif;
    --mono:'EK Modena Mono','EKModenaMono','DM Mono',ui-monospace,'SF Mono',Menlo,monospace;

    --pad:clamp(24px,3.6vw,48px);
    --crown:calc(clamp(19px,2.1vw,26px) * 3);
    --edge:rgba(227,227,227,.14);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html{color-scheme:dark;}
  body{
    margin:0;
    background:var(--black);
    color:var(--white);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }

  /* equal top and bottom breathing room, so the body sits on the optical
     centre of the viewport whatever the brand bar costs */
  .sheet{
    position:relative;
    min-height:100svh;
    padding:calc(var(--pad) + var(--crown)) var(--pad);
    display:flex;
    flex-direction:column;
    justify-content:center;
    background:var(--black);
  }

  /* logo: official file, left top corner, clear space of one icon width */
  .logo{
    display:block;
    height:clamp(19px,2.1vw,26px);
    width:auto;
  }
  .brandbar{position:absolute;top:var(--pad);left:var(--pad);}

  .body{
    max-width:1120px;
    width:100%;
    display:grid;
    gap:clamp(26px,4vh,44px);
  }

  h1{
    font-family:var(--sans);
    font-weight:500;
    font-size:clamp(28px,4.4vw,56px);
    line-height:1;
    letter-spacing:-.03em;
    text-wrap:balance;
    max-width:16ch;
    margin:0;
  }
  h1 em{
    font-family:var(--display);
    font-style:italic;
    font-weight:300;
    letter-spacing:0;
    font-size:1.06em;
  }

  /* ---- boarding pass ----------------------------------------------- */
  .ticket{
    display:grid;
    grid-template-columns:1fr clamp(112px,11vw,150px);
    border:1px solid var(--edge);
    background:
      repeating-linear-gradient(to right, rgba(227,227,227,.028) 0 1px, transparent 1px 28px),
      rgba(227,227,227,.022);
  }

  .pass,.stub{padding:clamp(17px,2.1vw,25px) clamp(17px,2.2vw,27px);}
  .pass{display:grid;gap:clamp(13px,1.7vw,19px);align-content:space-between;}

  .mono{
    font-family:var(--mono);
    font-weight:400;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-variant-numeric:tabular-nums;
  }

  .pass-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .tag{font-size:10px;letter-spacing:.2em;color:rgba(227,227,227,.5);}
  .mark{display:block;height:13px;width:auto;opacity:.9;}

  /* route: airport codes flanking the flight path */
  .route{
    display:grid;
    grid-template-columns:auto 1fr auto;
    align-items:center;
    gap:clamp(12px,1.6vw,20px);
  }
  .port{
    font-size:clamp(17px,1.9vw,23px);
    letter-spacing:.1em;
    color:var(--white);
    line-height:1;
  }
  .cities{
    display:flex;
    justify-content:space-between;
    gap:16px;
    font-size:10px;
    color:rgba(227,227,227,.5);
    margin-top:-6px;
  }

  .rail{
    position:relative;
    height:clamp(78px,8.6vw,104px);
    touch-action:none;
  }
  .rail-line,.rail-fill{
    position:absolute;
    top:50%;
    height:1px;
    pointer-events:none;
  }
  .rail-line{
    left:0;right:0;
    background:repeating-linear-gradient(to right, var(--grey) 0 3px, transparent 3px 8px);
  }
  .rail-fill{
    left:0;
    width:0;
    background:linear-gradient(to right, rgba(227,227,227,0) 0%, var(--glass) 88%);
  }
  .tick{
    position:absolute;
    top:50%;
    width:1px;
    height:11px;
    margin-top:-5px;
    background:var(--grey);
    pointer-events:none;
  }
  .tick.start{left:0;}
  .tick.end{right:0;}

  .plane{
    position:absolute;
    top:50%;
    left:0;
    width:clamp(108px,13vw,168px);
    aspect-ratio:1.55/1;
    transform:translate3d(0,-50%,0);
    cursor:grab;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }
  .plane:active{cursor:grabbing;}
  .plane canvas{display:block;width:100%;height:100%;}
  .plane:focus{outline:none;}
  .plane:focus-visible{outline:1px solid var(--glass);outline-offset:7px;}
  .plane.glide{transition:transform .42s cubic-bezier(.22,.7,.24,1);}

  /* ticket fields */
  .fields{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:14px;
    margin:0;
    padding-top:clamp(12px,1.5vw,16px);
    border-top:1px solid rgba(227,227,227,.09);
  }
  .fields > div{display:grid;gap:5px;min-width:0;}
  .fields dt{font-size:9px;letter-spacing:.18em;color:rgba(227,227,227,.42);}
  .fields dd{margin:0;font-size:11.5px;color:var(--white);}
  #status.armed{color:var(--white);}
  #status.done{color:var(--signal);}

  .undo{
    background:none;
    border:0;
    margin:0;
    padding:0 0 0 .8em;
    font:inherit;
    letter-spacing:.14em;
    color:rgba(227,227,227,.45);
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .undo:hover{color:rgba(227,227,227,.85);}
  .undo:focus-visible{outline:1px solid var(--glass);outline-offset:3px;}

  /* the tear-off stub */
  .stub{
    position:relative;
    border-left:1px dashed rgba(227,227,227,.3);
    min-width:0;
    display:grid;
    align-content:center;
  }
  .stub .fields{
    grid-template-columns:1fr;
    gap:clamp(14px,1.8vw,18px);
    border-top:0;
    padding-top:0;
  }
  .notch{
    position:absolute;
    z-index:2;
    width:15px;
    height:15px;
    border-radius:50%;
    background:var(--black);
    border:1px solid var(--edge);
    left:-8px;
  }
  .notch.top{top:-8px;}
  .notch.bottom{bottom:-8px;}

  @media (max-width:760px){
    .ticket{grid-template-columns:1fr;}
    .stub{
      border-left:0;
      border-top:1px dashed rgba(227,227,227,.3);
      min-width:0;
      align-content:start;
    }
    .stub .fields{grid-template-columns:repeat(2,minmax(0,1fr));}
    .notch{left:auto;}
    .notch.top{top:-8px;left:-8px;}
    .notch.bottom{bottom:auto;top:-8px;right:-8px;}
    .fields{grid-template-columns:repeat(2,minmax(0,1fr));}
    .plane{width:96px;}
    h1{max-width:none;}
  }

  @media (prefers-reduced-motion:reduce){
    .plane.glide{transition:none;}
  }
</style>
</head>
<body>
<div class="sheet">
  <header class="brandbar">
    <img class="logo" src="logo.svg" alt="microagi" width="1032" height="208">
  </header>

  <main class="body">
    <h1>Board the flight to <em>NeurIPS</em></h1>

    <section class="ticket">
      <div class="pass">
        <div class="pass-head">
          <span class="mono tag">Boarding pass</span>
          <img class="mark" src="logomark.svg" alt="" width="500" height="487">
        </div>

        <div>
          <div class="route">
            <span class="mono port">SFO</span>
            <div class="rail" id="rail">
              <div class="rail-line"></div>
              <div class="rail-fill" id="fill"></div>
              <span class="tick start"></span>
              <span class="tick end"></span>
              <div class="plane" id="plane" role="slider" tabindex="0"
                   aria-label="Slide the aircraft to Sydney to board the flight to NeurIPS"
                   aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="Not boarded">
                <canvas id="planecv"></canvas>
              </div>
            </div>
            <span class="mono port">SYD</span>
          </div>
          <div class="mono cities">
            <span>San Francisco</span>
            <span>Sydney</span>
          </div>
        </div>

        <dl class="mono fields">
          <div><dt>Flight</dt><dd>001</dd></div>
          <div><dt>Date</dt><dd>04 Dec 2026</dd></div>
          <div><dt>Class</dt><dd>Research</dd></div>
          <div><dt>Status</dt><dd id="status">Drag to board</dd></div>
        </dl>
      </div>

      <aside class="stub">
        <span class="notch top"></span>
        <span class="notch bottom"></span>
        <dl class="mono fields">
          <div><dt>Seat</dt><dd>1A</dd></div>
          <div><dt>Gate</dt><dd>TBA</dd></div>
        </dl>
      </aside>
    </section>
  </main>
</div>

<script>
(function(){
  var LINE='227,227,227';

  /* ---------- wireframe aircraft ------------------------------------ */
  function surface(f,NU,NV){
    var g=[],i,j,row;
    for(i=0;i<=NU;i++){ row=[]; for(j=0;j<=NV;j++){ row.push(f(i/NU,j/NV)); } g.push(row); }
    return g;
  }

  function model(){
    var S=[],s;

    /* fuselage: nose cone, constant barrel, upswept tail */
    S.push(surface(function(u,v){
      var t=u, r, yc=0;
      if(t<0.20){ r=0.115*Math.sqrt(Math.max(0,1-Math.pow(1-t/0.20,2))); }
      else if(t<0.66){ r=0.115; }
      else { var k=(t-0.66)/0.34; r=0.115*(1-0.93*k*k); yc=0.17*Math.pow(k,1.7); }
      var a=v*Math.PI*2;
      return [1.06-t*2.12, yc+r*Math.cos(a), r*Math.sin(a)];
    },20,10));

    /* swept wings */
    for(s=-1;s<=1;s+=2){ (function(sg){
      S.push(surface(function(u,v){
        var xr=0.40+v*(-0.48), xt=-0.20+v*(-0.24);
        return [xr+u*(xt-xr), -0.05+u*0.08, sg*(0.10+u*0.90)];
      },9,4));
    })(s); }

    /* vertical fin */
    S.push(surface(function(u,v){
      var xb=-0.50+v*(-0.52), xt=-0.82+v*(-0.24);
      return [xb+u*(xt-xb), 0.09+u*0.51, 0];
    },6,4));

    /* T-tail stabiliser */
    for(s=-1;s<=1;s+=2){ (function(sg){
      S.push(surface(function(u,v){
        var xr=-0.82+v*(-0.24), xt=-0.94+v*(-0.13);
        return [xr+u*(xt-xr), 0.60+u*0.04, sg*(u*0.40)];
      },5,3));
    })(s); }

    /* rear-mounted engines */
    for(s=-1;s<=1;s+=2){ (function(sg){
      S.push(surface(function(u,v){
        var r=0.062*(1-0.22*u*u), a=v*Math.PI*2;
        return [-0.22-u*0.38, 0.13+r*Math.cos(a), sg*0.19+r*Math.sin(a)];
      },8,8));
    })(s); }

    return S;
  }

  var SURFACES=model();

  function project(p){ return [p[0]+0.34*p[2], -p[1]+0.20*p[2]]; }

  function bounds(S){
    var b=[1e9,1e9,-1e9,-1e9],i,j,k,q;
    for(k=0;k<S.length;k++) for(i=0;i<S[k].length;i++) for(j=0;j<S[k][i].length;j++){
      q=project(S[k][i][j]);
      if(q[0]<b[0]) b[0]=q[0];
      if(q[1]<b[1]) b[1]=q[1];
      if(q[0]>b[2]) b[2]=q[0];
      if(q[1]>b[3]) b[3]=q[1];
    }
    return b;
  }
  var B=bounds(SURFACES);

  function drawPlane(cv){
    var box=cv.getBoundingClientRect();
    if(box.width<2||box.height<2) return;
    var dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.round(box.width*dpr);
    cv.height=Math.round(box.height*dpr);
    var ctx=cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,box.width,box.height);

    var padX=box.width*0.03, padY=box.height*0.04;
    var half=Math.max(Math.abs(B[1]),Math.abs(B[3]));
    var sc=Math.min((box.width-padX*2)/(B[2]-B[0]),(box.height/2-padY)/half);
    var ox=(box.width-(B[2]-B[0])*sc)/2-B[0]*sc;
    var oy=box.height/2;
    function P(p){ var q=project(p); return [ox+q[0]*sc, oy+q[1]*sc]; }

    ctx.lineWidth=Math.max(0.5,box.height*0.011);
    ctx.lineCap='round';

    function seg(a,b){
      var d=(a[2]+b[2])*0.5;                 /* depth: far side reads lighter */
      var al=0.34+0.66*((d+1)/2);
      ctx.strokeStyle='rgba('+LINE+','+al.toFixed(3)+')';
      var p=P(a), q=P(b);
      ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke();
    }

    for(var k=0;k<SURFACES.length;k++){
      var g=SURFACES[k];
      for(var i=0;i<g.length;i++) for(var j=0;j<g[i].length;j++){
        if(j+1<g[i].length) seg(g[i][j],g[i][j+1]);
        if(i+1<g.length)    seg(g[i][j],g[i+1][j]);
      }
    }
  }

  /* ---------- the boarding gesture ---------------------------------- */
  var rail=document.getElementById('rail');
  var plane=document.getElementById('plane');
  var cv=document.getElementById('planecv');
  var fill=document.getElementById('fill');
  var status=document.getElementById('status');

  var KEY='microagi.neurips.boarded';
  var value=0, boarded=false, dragging=false, startX=0, startVal=0;

  function span(){ return Math.max(1, rail.clientWidth - plane.offsetWidth); }

  function paint(){
    var x=value*span();
    plane.style.transform='translate3d('+x+'px,-50%,0)';
    fill.style.width=x+'px';
    plane.setAttribute('aria-valuenow',Math.round(value*100));

    if(boarded){
      fill.style.background='linear-gradient(to right, rgba(0,255,81,0) 0%, #00FF51 55%)';
      status.className='done';
      status.innerHTML='Boarded<button class="undo" id="undo" type="button">reset</button>';
      document.getElementById('undo').addEventListener('click',reset);
      plane.setAttribute('aria-valuetext','Boarded');
    }else{
      fill.style.background='linear-gradient(to right, rgba(227,227,227,0) 0%, #E3E3E3 88%)';
      if(dragging||value>0.01){
        status.className='armed';
        status.textContent='Boarding '+Math.round(value*100)+'%';
      }else{
        status.className='';
        status.textContent='Drag to board';
      }
      plane.setAttribute('aria-valuetext', value>0.01 ? Math.round(value*100)+' percent' : 'Not boarded');
    }
  }

  function settle(v){
    plane.classList.add('glide');
    value=v; paint();
    setTimeout(function(){ plane.classList.remove('glide'); },440);
  }

  function board(){
    boarded=true;
    try{ localStorage.setItem(KEY,'1'); }catch(e){}
    settle(1);
  }
  function reset(){
    boarded=false;
    try{ localStorage.removeItem(KEY); }catch(e){}
    settle(0);
  }

  plane.addEventListener('pointerdown',function(e){
    if(boarded) return;
    dragging=true; startX=e.clientX; startVal=value;
    plane.setPointerCapture(e.pointerId);
    plane.classList.remove('glide');
    e.preventDefault();
  });
  plane.addEventListener('pointermove',function(e){
    if(!dragging) return;
    value=Math.min(1,Math.max(0,startVal+(e.clientX-startX)/span()));
    paint();
  });
  function release(){
    if(!dragging) return;
    dragging=false;
    if(value>=0.96) board(); else settle(0);
  }
  plane.addEventListener('pointerup',release);
  plane.addEventListener('pointercancel',release);

  plane.addEventListener('keydown',function(e){
    var step=0.08, v=value;
    if(e.key==='ArrowRight'||e.key==='ArrowUp') v=Math.min(1,value+step);
    else if(e.key==='ArrowLeft'||e.key==='ArrowDown') v=Math.max(0,value-step);
    else if(e.key==='End'||e.key===' '||e.key==='Enter') v=1;
    else if(e.key==='Home'){ if(boarded) reset(); return; }
    else return;
    e.preventDefault();
    if(boarded) return;
    if(v>=0.999){ board(); } else { settle(v); }
  });

  try{ if(localStorage.getItem(KEY)==='1'){ boarded=true; value=1; } }catch(e){}

  function layout(){ drawPlane(cv); paint(); }
  layout();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layout);
  var t;
  window.addEventListener('resize',function(){ clearTimeout(t); t=setTimeout(layout,120); });
})();
</script>
</body>
</html>
